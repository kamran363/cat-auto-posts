
name: Cat daily posts
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued item
        env:
          PAGE_ID: '1318094988059656'
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 scripts/post.py && git config user.name "cat-auto" && git config user.email "cat-auto@users.noreply.github.com" && git add content/state.json && git diff --cached --quiet || git commit -m "advance queue" && git push
